<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Trigger Radar | Deloitte Human Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=STIX+Two+Text:ital,wght@1,600&display=optional" rel="stylesheet">
<style>
  :root{
    --green:#86BC25;
    --neon:#86EB22;
    --blue:#00A3E0;
    --dark:#282728;
    --black:#000000;
    --white:#FFFFFF;
    --gray-mid:#5b5a5b;
    --gray-light:#e9e8e6;
    --radius:18px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;-webkit-overflow-scrolling:touch;}
  body{
    font-family:'Open Sans', Arial, sans-serif;
    background:var(--dark);
    color:var(--white);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
    background:var(--dark);
  }

  .motif{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }
  .motif-1{
    width:340px;height:340px;
    top:-160px; right:-140px;
    background:radial-gradient(circle at 30% 30%, rgba(134,235,34,0.35), rgba(134,235,34,0) 70%);
  }
  .motif-2{
    width:220px;height:220px;
    bottom:-110px; left:-90px;
    background:radial-gradient(circle at 60% 60%, rgba(0,163,224,0.25), rgba(0,163,224,0) 70%);
  }

  .topbar{
    position:relative;
    z-index:2;
    padding:22px 24px 10px 24px;
  }
  .bootcamp-tag{
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--green);
    margin-bottom:6px;
  }
  .wordmark{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  .wordmark .accent{
    font-family:'STIX Two Text', serif;
    font-style:italic;
    font-weight:600;
    color:var(--neon);
    margin-left:4px;
  }
  .eyebrow-small{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gray-light);
    opacity:0.7;
    margin-top:2px;
  }

  .progress-track{
    display:flex;
    gap:6px;
    margin-top:16px;
  }
  .progress-seg{
    height:4px;
    flex:1;
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-seg > span{
    display:block;
    height:100%;
    width:0%;
    background:var(--green);
    transition:width 0.3s ease;
  }
  .progress-seg.done > span{width:100%;}
  .progress-seg.active > span{width:60%;}

  .stage{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px 24px 40px 24px;
  }

  .card{
    background:var(--white);
    color:var(--black);
    border-radius:var(--radius);
    padding:26px 22px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
  }

  h1.screen-title{
    font-size:24px;
    font-weight:700;
    margin:0 0 10px 0;
    color:var(--white);
  }
  p.body-text{
    font-size:15px;
    line-height:1.55;
    color:var(--gray-light);
    margin:0 0 22px 0;
  }

  .field-group{
    margin-bottom:16px;
  }
  label.field-label{
    display:block;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--gray-mid);
    margin-bottom:6px;
  }
  input[type="text"]{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:2px solid var(--gray-light);
    font-size:16px;
    font-family:inherit;
    background:var(--white);
    color:var(--black);
  }
  input[type="text"]:focus{
    outline:none;
    border-color:var(--green);
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:15px 20px;
    border-radius:999px;
    border:none;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-primary{
    background:var(--green);
    color:var(--black);
    margin-top:8px;
  }
  .btn-primary:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .btn-primary:not(:disabled):active{
    transform:scale(0.98);
  }
  .btn-dark{
    background:var(--black);
    color:var(--white);
  }

  .eyebrow{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--white);
    background:var(--black);
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:14px;
  }

  .statement-box{
    background:var(--gray-light);
    border-left:4px solid var(--green);
    border-radius:10px;
    padding:16px 16px;
    font-size:16px;
    line-height:1.5;
    color:var(--black);
    margin-bottom:20px;
  }

  .question-line{
    font-size:15px;
    font-weight:700;
    color:var(--black);
    margin-bottom:18px;
  }

  .slider-wrap{
    margin:26px 0 8px 0;
  }
  .slider-value{
    text-align:center;
    font-size:38px;
    font-weight:700;
    color:var(--green);
    margin-bottom:6px;
    min-height:46px;
  }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:8px;
    border-radius:6px;
    background:linear-gradient(to right, var(--green) 0%, var(--green) 50%, var(--gray-light) 50%, var(--gray-light) 100%);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:28px;height:28px;
    border-radius:50%;
    background:var(--white);
    border:4px solid var(--green);
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  input[type="range"]::-moz-range-thumb{
    width:28px;height:28px;
    border-radius:50%;
    background:var(--white);
    border:4px solid var(--green);
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .slider-labels{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--gray-mid);
    margin-top:8px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }

  .step-count{
    text-align:center;
    font-size:12px;
    color:var(--gray-mid);
    margin-top:22px;
  }

  .center-stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .reveal-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:20px;
  }
  .reveal-card{
    background:var(--white);
    color:var(--black);
    border-radius:14px;
    padding:16px 16px;
    border:2px solid transparent;
  }
  .reveal-card.gap{
    border-color:var(--blue);
  }
  .reveal-card .stmt-text{
    font-size:13.5px;
    color:var(--gray-mid);
    line-height:1.4;
    margin-bottom:12px;
  }
  .stat-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .stat-chip{
    background:var(--gray-light);
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    flex:1;
    min-width:120px;
  }
  .stat-chip b{
    display:block;
    font-size:18px;
    color:var(--black);
  }
  .stat-chip.gap-chip{
    background:var(--blue);
    color:var(--white);
  }
  .stat-chip.gap-chip b{color:var(--white);}
  .discussion-q{
    margin-top:12px;
    font-size:13.5px;
    font-style:italic;
    color:var(--black);
    background:rgba(0,163,224,0.1);
    border-left:3px solid var(--blue);
    padding:10px 12px;
    border-radius:6px;
  }

  .pattern-card{
    background:var(--white);
    color:var(--black);
    border-radius:14px;
    padding:20px 18px;
    margin-bottom:16px;
  }
  .pattern-name{
    font-size:14px;
    font-weight:700;
    color:var(--gray-mid);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-bottom:10px;
  }
  .pattern-block{
    margin-bottom:14px;
  }
  .pattern-block:last-child{margin-bottom:0;}
  .pattern-tag{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-bottom:4px;
  }
  .pattern-tag.high{color:var(--blue);}
  .pattern-tag.low{color:var(--green);}
  .pattern-type{
    font-family:'STIX Two Text', serif;
    font-style:italic;
    font-weight:600;
    font-size:22px;
    color:var(--black);
    margin-bottom:6px;
  }
  .pattern-desc{
    font-size:14px;
    line-height:1.5;
    color:var(--gray-mid);
  }

  .note-text{
    font-size:12.5px;
    color:var(--gray-light);
    opacity:0.75;
    text-align:center;
    margin-bottom:18px;
  }

  .share-box{
    background:var(--white);
    color:var(--black);
    border-radius:14px;
    padding:22px 20px;
    margin-bottom:20px;
  }
  .share-box .share-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--gray-mid);
    margin-bottom:10px;
  }
  .share-box ul{
    margin:0;
    padding-left:18px;
    font-size:14.5px;
    line-height:1.6;
    color:var(--black);
  }

  .duo-tag{
    font-size:12px;
    color:var(--gray-light);
    opacity:0.7;
    margin-top:4px;
    text-align:center;
  }
</style>
</head>
<body>

<div id="app">
  <div class="motif motif-1"></div>
  <div class="motif motif-2"></div>

  <div class="topbar">
    <div class="bootcamp-tag">Deloitte Human Capital Bootcamp 2026</div>
    <div class="wordmark">Trigger<span class="accent">Radar</span></div>
    <div class="eyebrow-small" id="phaseLabel">Personal leadership with AI</div>
    <div class="progress-track" id="progressTrack"></div>
  </div>

  <div class="stage" id="stage"></div>
</div>

<script>
(function(){

  const statements = [
    {
      id: 1,
      category: "Autonomy",
      text: "You're mid-workshop with the client when they turn to the AI copilot for a second opinion on your change approach, right in front of you.",
      discussion: "What does it feel like when the client questions your read of the room in real time, with a tool as the alternative?"
    },
    {
      id: 2,
      category: "Recognition",
      text: "A teammate delivers the same stakeholder analysis you spent a full day on, in twenty minutes with AI, and gets the compliment from the client on the next call.",
      discussion: "What would it mean for you if the hours you put in stop being what gets noticed?"
    },
    {
      id: 3,
      category: "Control",
      text: "A colleague on your team sends an AI-drafted communication straight to the client without fully checking it first, because the deadline was ten minutes away.",
      discussion: "What would need to be true for you to trust a teammate's judgment on when it's fine to skip that check?"
    },
    {
      id: 4,
      category: "Fairness",
      text: "A first-year consultant outproduces you on a deliverable using AI, and the partner notices.",
      discussion: "What does 'earned' mean to you, when speed with a tool starts to outweigh years of experience?"
    },
    {
      id: 5,
      category: "Pace",
      text: "In the kickoff, the client asks how your team is using AI on this engagement. You improvise an answer, because the honest one is that you're still figuring it out yourself.",
      discussion: "What's the actual risk in admitting you're still learning, versus performing a confidence you don't have?"
    },
    {
      id: 6,
      category: "Identity",
      text: "The client asks, half joking, if they still need a consultant for this now that AI can draft the same deck.",
      discussion: "If part of your expertise shifts, what's left that's still uniquely yours?"
    },
    {
      id: 7,
      category: "Credibility",
      text: "Mid-presentation, the CFO stops you and asks you to defend a number the AI generated. Your team is in the room. You can't.",
      discussion: "What's the cost of saying 'I don't know yet' to a client, compared to the cost of pretending you do?"
    },
    {
      id: 8,
      category: "Ownership",
      text: "The partner presents your AI-supported analysis to the client as their own insight, without mentioning you or the tool.",
      discussion: "Where does your sense of ownership over work actually come from, the credit or the outcome?"
    }
  ];

  const patternTexts = {
    Autonomy: {
      high: "You like to stay in the driver's seat. When AI, or anyone else, takes that away without asking, it stings more than you let on.",
      low: "You let go of the wheel easily. That's useful in a fast-changing field, just make sure you're choosing to hand over control, not just defaulting to it."
    },
    Recognition: {
      high: "Being seen for your effort matters to you. When AI makes the visible work invisible, that's where it actually hurts.",
      low: "Recognition doesn't drive you much. That can be freeing, but watch that it doesn't turn into quietly under-selling your own value."
    },
    Control: {
      high: "You want to understand before you trust. Skipping the check on AI output feels like a risk you're not willing to take.",
      low: "You're comfortable trusting the black box. That's efficient, as long as comfortable doesn't quietly become careless."
    },
    Fairness: {
      high: "You're sensitive to what's earned versus what's fast. Someone winning with AI can feel like the rules just changed on you.",
      low: "Outcome matters more to you than how someone got there. A useful mindset, as long as it doesn't excuse cutting corners either."
    },
    Pace: {
      high: "You feel the gap between what's expected of you and what you're actually ready for, and that gap creates real pressure.",
      low: "Pace doesn't rattle you much. Just check that keeping up isn't quietly turning into winging it."
    },
    Identity: {
      high: "Part of your professional identity is tied to expertise that's shifting under your feet, and that's genuinely unsettling.",
      low: "You don't tie your identity too tightly to any one skill. That's resilient, as long as you still know what you bring."
    },
    Credibility: {
      high: "Being caught without a clear answer feels like a direct hit, especially in front of a client.",
      low: "You're fine saying 'let me get back to you.' That's confidence, not weakness, just make sure the client hears it that way too."
    },
    Ownership: {
      high: "Not getting credit for your work touches something deep. You want your name attached to what you built.",
      low: "Credit matters less to you than getting it right. Good for the team, just don't let it quietly become invisible labor."
    }
  };

  let state = {
    nameA: "",
    nameB: "",
    ownA: {},
    ownB: {}
  };

  let steps = [];
  steps.push({ type: "welcome" });
  steps.push({ type: "private-intro", person: "A" });
  statements.forEach(s => steps.push({ type: "private", stmt: s, person: "A" }));
  steps.push({ type: "handoff", from: "A", to: "B" });
  steps.push({ type: "private-intro", person: "B" });
  statements.forEach(s => steps.push({ type: "private", stmt: s, person: "B" }));
  steps.push({ type: "reveal-intro" });
  steps.push({ type: "reveal" });
  steps.push({ type: "patterns" });
  steps.push({ type: "closer" });

  let idx = 0;

  function name(p){
    if(p === "A") return state.nameA || "Person 1";
    return state.nameB || "Person 2";
  }

  function phaseOf(type){
    if(type === "welcome") return 0;
    if(type === "private-intro" || type === "private" || type === "handoff") return 1;
    if(type === "reveal-intro" || type === "reveal") return 2;
    if(type === "patterns") return 3;
    return 4;
  }

  const phaseLabels = ["Start","Answer","Reveal","Patterns","Close"];

  function renderProgress(){
    const track = document.getElementById("progressTrack");
    const label = document.getElementById("phaseLabel");
    const current = phaseOf(steps[idx].type);
    label.textContent = phaseLabels[current] + "  ·  Personal leadership with AI";
    track.innerHTML = "";
    for(let i=1;i<=4;i++){
      const seg = document.createElement("div");
      seg.className = "progress-seg";
      if(i < current) seg.classList.add("done");
      else if(i === current) seg.classList.add("active");
      const fill = document.createElement("span");
      seg.appendChild(fill);
      track.appendChild(seg);
    }
  }

  function go(){
    idx++;
    render();
    window.scrollTo(0,0);
  }

  function updateSliderFill(input){
    const val = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.background = `linear-gradient(to right, var(--green) 0%, var(--green) ${val}%, var(--gray-light) ${val}%, var(--gray-light) 100%)`;
  }

  function sliderMarkup(idPrefix){
    return `
      <div class="slider-wrap">
        <div class="slider-value" id="${idPrefix}-value">Tap the slider</div>
        <input type="range" min="1" max="5" step="1" id="${idPrefix}-range" class="trigger-slider">
        <div class="slider-labels"><span>Not triggered</span><span>Very triggered</span></div>
      </div>
    `;
  }

  function wireSlider(idPrefix, onChange){
    const input = document.getElementById(idPrefix + "-range");
    const valueLabel = document.getElementById(idPrefix + "-value");
    const nextBtn = document.getElementById("nextBtn");
    input.addEventListener("input", function(){
      valueLabel.textContent = input.value + " / 5";
      updateSliderFill(input);
      if(nextBtn) nextBtn.disabled = false;
      onChange(parseInt(input.value,10));
    });
  }

  function render(){
    renderProgress();
    const stage = document.getElementById("stage");
    const step = steps[idx];

    if(step.type === "welcome"){
      stage.innerHTML = `
        <div class="center-stage">
          <h1 class="screen-title">What actually gets under your skin?</h1>
          <p class="body-text">Eight sharp, client-facing AI moments. Rate how much each one triggers you, honestly, just for yourself. Then compare notes with your partner and see what your profile says about you.</p>
          <div class="card">
            <div class="field-group">
              <label class="field-label">Person 1 name</label>
              <input type="text" id="nameAInput" placeholder="e.g. Sam">
            </div>
            <div class="field-group">
              <label class="field-label">Person 2 name</label>
              <input type="text" id="nameBInput" placeholder="e.g. Jordan">
            </div>
            <button class="btn btn-primary" id="nextBtn">Start</button>
          </div>
        </div>
      `;
      document.getElementById("nextBtn").addEventListener("click", function(){
        state.nameA = document.getElementById("nameAInput").value.trim() || "Person 1";
        state.nameB = document.getElementById("nameBInput").value.trim() || "Person 2";
        go();
      });
    }

    else if(step.type === "private-intro"){
      const p = step.person;
      const other = p === "A" ? "B" : "A";
      stage.innerHTML = `
        <div class="center-stage">
          <h1 class="screen-title">${name(p)}, you're up</h1>
          <p class="body-text">${name(other)}, look away for a moment. ${name(p)}, answer honestly, just for yourself. Nobody sees this screen until you're ready to share.</p>
          <button class="btn btn-primary" id="nextBtn">I'm ready</button>
        </div>
      `;
      document.getElementById("nextBtn").addEventListener("click", go);
    }

    else if(step.type === "private"){
      const s = step.stmt;
      const p = step.person;
      const qCount = statements.indexOf(s) + 1;
      const isLast = qCount === statements.length;
      stage.innerHTML = `
        <div class="card">
          <span class="eyebrow">${s.category}</span>
          <div class="statement-box">${s.text}</div>
          <div class="question-line">Be honest, how much does this trigger you?</div>
          ${sliderMarkup("private")}
          <button class="btn btn-primary" id="nextBtn" disabled>${isLast ? "Done" : "Next"}</button>
        </div>
        <div class="step-count">Question ${qCount} of ${statements.length}, just for ${name(p)}</div>
      `;
      wireSlider("private", function(val){
        if(p === "A") state.ownA[s.id] = val;
        else state.ownB[s.id] = val;
      });
      document.getElementById("nextBtn").addEventListener("click", go);
    }

    else if(step.type === "handoff"){
      stage.innerHTML = `
        <div class="center-stage">
          <h1 class="screen-title">Thanks, ${name(step.from)}</h1>
          <p class="body-text">Your answers are saved and hidden. Hand the phone to ${name(step.to)} now.</p>
          <button class="btn btn-primary" id="nextBtn">I'm ${name(step.to)}, continue</button>
        </div>
      `;
      document.getElementById("nextBtn").addEventListener("click", go);
    }

    else if(step.type === "reveal-intro"){
      stage.innerHTML = `
        <div class="center-stage">
          <h1 class="screen-title">The Reveal</h1>
          <p class="body-text">Here's how your answers compare. Look for the biggest gaps, that's usually where it gets interesting.</p>
          <button class="btn btn-primary" id="nextBtn">Show us</button>
        </div>
      `;
      document.getElementById("nextBtn").addEventListener("click", go);
    }

    else if(step.type === "reveal"){
      let cards = "";
      statements.forEach(s => {
        const valA = state.ownA[s.id];
        const valB = state.ownB[s.id];
        const gap = Math.abs(valA - valB);
        const isGap = gap >= 2;
        cards += `
          <div class="reveal-card ${isGap ? "gap" : ""}">
            <span class="eyebrow">${s.category}</span>
            <div class="stmt-text">${s.text}</div>
            <div class="stat-row">
              <div class="stat-chip"><b>${valA}</b>${name("A")}</div>
              <div class="stat-chip"><b>${valB}</b>${name("B")}</div>
            </div>
            ${isGap ? `<div class="discussion-q">${s.discussion}</div>` : ``}
            ${isGap ? `<div class="stat-chip gap-chip" style="margin-top:10px;"><b>${gap}</b>point gap</div>` : ``}
          </div>
        `;
      });
      stage.innerHTML = `
        <h1 class="screen-title">Where you differ</h1>
        <div class="reveal-list">${cards}</div>
        <button class="btn btn-primary" id="nextBtn">See your patterns</button>
      `;
      document.getElementById("nextBtn").addEventListener("click", go);
    }

    else if(step.type === "patterns"){
      function extremes(ownScores){
        let max = -Infinity, min = Infinity;
        statements.forEach(s => {
          if(ownScores[s.id] > max) max = ownScores[s.id];
          if(ownScores[s.id] < min) min = ownScores[s.id];
        });
        const highCats = statements.filter(s => ownScores[s.id] === max).map(s => s.category);
        const lowCats = statements.filter(s => ownScores[s.id] === min).map(s => s.category);
        return { highCats, lowCats };
      }

      function patternCard(personName, ownScores){
        const { highCats, lowCats } = extremes(ownScores);
        const highText = highCats.map(c => patternTexts[c].high).join(" ");
        const lowText = lowCats.map(c => patternTexts[c].low).join(" ");
        return `
          <div class="pattern-card">
            <div class="pattern-name">${personName}</div>
            <div class="pattern-block">
              <div class="pattern-tag high">Most triggered by</div>
              <div class="pattern-type">${highCats.join(" / ")}</div>
              <div class="pattern-desc">${highText}</div>
            </div>
            <div class="pattern-block">
              <div class="pattern-tag low">Least triggered by</div>
              <div class="pattern-type">${lowCats.join(" / ")}</div>
              <div class="pattern-desc">${lowText}</div>
            </div>
          </div>
        `;
      }

      stage.innerHTML = `
        <h1 class="screen-title">Your Trigger Profile</h1>
        ${patternCard(name("A"), state.ownA)}
        ${patternCard(name("B"), state.ownB)}
        <p class="note-text">This isn't a diagnosis, just a starting point for the conversation.</p>
        <button class="btn btn-primary" id="nextBtn">Wrap up</button>
      `;
      document.getElementById("nextBtn").addEventListener("click", go);
    }

    else if(step.type === "closer"){
      stage.innerHTML = `
        <h1 class="screen-title">Bring it to the group</h1>
        <p class="body-text">Look at your Trigger Profile together and pick one thing to share when the facilitator opens it up.</p>
        <div class="share-box">
          <div class="share-label">Share one of these</div>
          <ul>
            <li>Your most triggered category, and why it landed</li>
            <li>Your least triggered category, and whether that surprised your partner</li>
            <li>The moment where your scores were furthest apart</li>
          </ul>
        </div>
        <button class="btn btn-dark" id="restartBtn">Start over for the next duo</button>
        <div class="duo-tag">Trigger Radar, Deloitte Human Capital Bootcamp 2026</div>
      `;
      document.getElementById("restartBtn").addEventListener("click", function(){
        state = { nameA:"", nameB:"", ownA:{}, ownB:{} };
        idx = 0;
        render();
        window.scrollTo(0,0);
      });
    }
  }

  render();
})();
</script>

</body>
</html>
